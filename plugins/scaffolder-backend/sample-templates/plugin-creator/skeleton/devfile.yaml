schemaVersion: 2.2.0
metadata:
  name: ${{ values.pluginName }}-dev
  version: 1.0.0
  displayName: "Plugin: ${{ values.pluginName }}"
  description: >-
    Dev Spaces workspace for developing and testing the ${{ values.pluginName }}
    dynamic plugin against a real RHDH instance.
attributes:
  controller.devfile.io/storage-type: per-workspace
projects:
  - name: rhdh-local
    git:
      remotes:
        origin: ${{ values.rhdhLocalRepoUrl }}
      checkoutFrom:
        remote: origin
        revision: main
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      mountSources: true
      memoryLimit: 4Gi
      memoryRequest: 512Mi
      cpuLimit: "2"
      cpuRequest: 500m
      env:
        - name: PLUGIN_NAME
          value: ${{ values.pluginName }}
        - name: PLUGIN_DIR
          value: /projects/${{ values.pluginName }}
        - name: RHDH_LOCAL_DIR
          value: /projects/rhdh-local
        - name: DYNAMIC_PLUGINS_ROOT
          value: /dynamic-plugins-root
        - name: NODE_OPTIONS
          value: "--max-old-space-size=3072"
      endpoints:
        - name: plugin-dev
          exposure: public
          targetPort: 3000
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
      volumeMounts:
        - name: dynamic-plugins-root
          path: /dynamic-plugins-root
        - name: yarn-cache
          path: /home/user/.cache/yarn
  - name: rhdh
    container:
      image: quay.io/rhdh-community/rhdh:1.10
      command: ["tail"]
      args: ["-f", "/dev/null"]
      mountSources: true
      memoryLimit: 4Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      env:
        - name: DEVSPACE_SCRIPTS_DIR
          value: /projects/rhdh-local
        - name: BASE_URL
          value: auto
        - name: RHDH_PUBLIC_ENDPOINT_NAME
          value: rhdh
        - name: NODE_ENV
          value: development
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
        - name: CATALOG_INDEX_IMAGE
          value: quay.io/rhdh/plugin-catalog-index:1.10
        - name: WAIT_FOR_PLUGINS_TIMEOUT
          value: "180"
        - name: CATALOG_ENTITIES_EXTRACT_DIR
          value: /opt/app-root/src/extensions
        - name: ENABLE_AUTH_PROVIDER_MODULE_OVERRIDE
          value: "true"
        - name: ENABLE_CORE_ROOTHTTPROUTER_OVERRIDE
          value: "true"
      endpoints:
        - name: rhdh
          exposure: public
          targetPort: 7007
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
      volumeMounts:
        - name: dynamic-plugins-root
          path: /opt/app-root/src/dynamic-plugins-root
        - name: dynamic-plugins-root
          path: /dynamic-plugins-root
        - name: extensions-catalog
          path: /opt/app-root/src/extensions
  - name: dynamic-plugins-root
    volume:
      size: 2Gi
  - name: extensions-catalog
    volume:
      size: 1Gi
  - name: yarn-cache
    volume:
      size: 2Gi
commands:
  # ── Primary workflow: develop against real RHDH ──────────────────────────
  - id: install-deps
    exec:
      label: "1. Install dependencies"
      component: tools
      commandLine: cd /projects/${{ values.pluginName }} && yarn install
      workingDir: /projects/${{ values.pluginName }}
      group:
        kind: build
        isDefault: true
  - id: deploy-and-reload
    exec:
      label: "2. Deploy plugin to RHDH"
      component: tools
      commandLine: |
        set -e
        cd /projects/${{ values.pluginName }}
        echo "[plugin] Exporting dynamic plugin..."
        yarn export-dynamic
        echo "[plugin] Copying to dynamic-plugins-root..."
        PLUGIN_PKG=$(node -p "require('./package.json').name.replace('@','').replace('/','-')")
        rm -rf "/dynamic-plugins-root/${PLUGIN_PKG}" 2>/dev/null || true
        cp -r dist-dynamic "/dynamic-plugins-root/${PLUGIN_PKG}"
        echo "[plugin] Deployed. Restarting RHDH..."
        # Signal the rhdh container to restart via shared file
        echo "restart" > /dynamic-plugins-root/.restart-signal
        echo "[plugin] Waiting for RHDH to reload (check the RHDH endpoint)..."
      workingDir: /projects/${{ values.pluginName }}
      group:
        kind: build
        isDefault: false
  - id: restart-rhdh
    exec:
      label: "3. Restart RHDH"
      component: rhdh
      commandLine: |
        echo "[rhdh] Stopping RHDH..."
        pkill -f 'node.*packages/backend' 2>/dev/null || true
        sleep 2
        pkill -9 -f 'node.*packages/backend' 2>/dev/null || true
        sleep 1
        echo "[rhdh] Starting RHDH..."
        chmod +x /projects/rhdh-local/scripts/start-rhdh.sh 2>/dev/null
        bash /projects/rhdh-local/scripts/start-rhdh.sh
      workingDir: /projects
      group:
        kind: run
        isDefault: false
  - id: test
    exec:
      label: "4. Run tests"
      component: tools
      commandLine: cd /projects/${{ values.pluginName }} && yarn test
      workingDir: /projects/${{ values.pluginName }}
      group:
        kind: test
        isDefault: true
  - id: push-and-pr
    exec:
      label: "5. Push branch & create PR"
      component: tools
      commandLine: |
        set -e
        cd /projects/${{ values.pluginName }}
        BRANCH="feat/${PLUGIN_NAME}-$(date +%Y%m%d%H%M)"
        git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
        git add -A
        git commit -m "feat(${PLUGIN_NAME}): initial plugin implementation"
        git push -u origin "$BRANCH"
        gh pr create --fill
      workingDir: /projects/${{ values.pluginName }}
      group:
        kind: build
        isDefault: false
  # ── Optional: standalone UI iteration (no backend/plugins) ──────────────
  - id: start-plugin-dev
    exec:
      label: "(Optional) Start standalone dev server"
      component: tools
      commandLine: cd /projects/${{ values.pluginName }} && yarn start
      workingDir: /projects/${{ values.pluginName }}
      group:
        kind: run
        isDefault: false
  # ── Infrastructure (runs automatically) ─────────────────────────────────
  - id: init-rhdh
    exec:
      label: Initialize RHDH (background)
      component: rhdh
      commandLine: |
        nohup bash -c '
          chmod +x /projects/rhdh-local/scripts/start-rhdh.sh 2>/dev/null
          bash /projects/rhdh-local/scripts/start-rhdh.sh
        ' > /tmp/rhdh-startup.log 2>&1 &
        echo "[rhdh] RHDH starting in background. Monitor with: tail -f /tmp/rhdh-startup.log"
      workingDir: /projects
      group:
        kind: run
        isDefault: false
  - id: start-rhdh
    exec:
      label: Start RHDH (foreground)
      component: rhdh
      commandLine: |
        chmod +x /projects/rhdh-local/scripts/start-rhdh.sh 2>/dev/null
        bash /projects/rhdh-local/scripts/start-rhdh.sh
      workingDir: /projects
      group:
        kind: run
        isDefault: true
events:
  postStart:
    - install-deps
    - init-rhdh
