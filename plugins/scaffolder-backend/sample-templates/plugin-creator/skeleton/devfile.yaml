schemaVersion: 2.2.0
metadata:
  name: ${{ values.pluginName }}-dev
  version: 1.0.0
  displayName: "Plugin: ${{ values.pluginName }}"
  description: >-
    Dev Spaces workspace for developing and testing the ${{ values.pluginName }}
    dynamic plugin against a real RHDH instance.
attributes:
  controller.devfile.io/storage-type: per-workspace
projects:
  - name: rhdh-local
    git:
      remotes:
        origin: ${{ values.rhdhLocalRepoUrl }}
      checkoutFrom:
        remote: origin
        revision: main
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      mountSources: true
      memoryLimit: 3Gi
      memoryRequest: 256Mi
      cpuLimit: "1"
      cpuRequest: 100m
      env:
        - name: PLUGIN_NAME
          value: ${{ values.pluginName }}
        - name: PLUGIN_DIR
          value: /projects/${{ values.pluginName }}
        - name: RHDH_LOCAL_DIR
          value: /projects/rhdh-local
        - name: DYNAMIC_PLUGINS_ROOT
          value: /dynamic-plugins-root
        - name: NODE_OPTIONS
          value: "--max-old-space-size=3072"
      endpoints:
        - name: plugin-dev
          exposure: public
          targetPort: 3000
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
      volumeMounts:
        - name: dynamic-plugins-root
          path: /dynamic-plugins-root
        - name: yarn-cache
          path: /home/user/.cache/yarn
  - name: rhdh
    container:
      image: quay.io/rhdh-community/rhdh:1.10
      command: ["tail"]
      args: ["-f", "/dev/null"]
      mountSources: true
      memoryLimit: 3Gi
      memoryRequest: 256Mi
      cpuLimit: "1"
      cpuRequest: 100m
      env:
        - name: DEVSPACE_SCRIPTS_DIR
          value: /projects/rhdh-local
        - name: BASE_URL
          value: auto
        - name: RHDH_PUBLIC_ENDPOINT_NAME
          value: rhdh
        - name: NODE_ENV
          value: development
        - name: NODE_OPTIONS
          value: "--no-node-snapshot"
        - name: CATALOG_INDEX_IMAGE
          value: quay.io/rhdh/plugin-catalog-index:1.10
        - name: WAIT_FOR_PLUGINS_TIMEOUT
          value: "180"
        - name: CATALOG_ENTITIES_EXTRACT_DIR
          value: /opt/app-root/src/extensions
        - name: ENABLE_AUTH_PROVIDER_MODULE_OVERRIDE
          value: "true"
        - name: ENABLE_CORE_ROOTHTTPROUTER_OVERRIDE
          value: "true"
      endpoints:
        - name: rhdh
          exposure: public
          targetPort: 7007
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
      volumeMounts:
        - name: dynamic-plugins-root
          path: /opt/app-root/src/dynamic-plugins-root
        - name: dynamic-plugins-root
          path: /dynamic-plugins-root
        - name: extensions-catalog
          path: /opt/app-root/src/extensions
  - name: dynamic-plugins-root
    volume:
      size: 2Gi
  - name: extensions-catalog
    volume:
      size: 1Gi
  - name: yarn-cache
    volume:
      size: 2Gi
commands:
  # ── Primary workflow: develop against real RHDH ──────────────────────────
  - id: install-deps
    exec:
      label: "1. Install dependencies"
      component: tools
      commandLine: |
        PLUGIN_DIR="${PROJECT_SOURCE:-/projects/${{ values.pluginName }}}"
        if [ ! -d "$PLUGIN_DIR" ]; then
          for d in /projects/*/package.json; do
            [ -f "$d" ] && PLUGIN_DIR="$(dirname "$d")" && break
          done
        fi
        cd "$PLUGIN_DIR" && yarn install
      workingDir: /projects
      group:
        kind: build
        isDefault: true
  - id: deploy-and-reload
    exec:
      label: "2. Deploy plugin to RHDH"
      component: tools
      commandLine: |
        set -e
        cd "${PROJECT_SOURCE:-/projects/${{ values.pluginName }}}"
        echo "[plugin] Exporting dynamic plugin..."
        yarn export-dynamic

        # ── Copy the built plugin to dynamic-plugins-root ──
        _PKG_NAME=$(node -p "require('./package.json').name.replace('@','').replace('/','-')")
        _DEST="/dynamic-plugins-root/${_PKG_NAME}"
        echo "[plugin] Copying to $_DEST..."
        rm -rf "$_DEST" 2>/dev/null || true
        cp -r dist-dynamic "$_DEST"

        # ── Print config snippet for the user to add ──
        _SCALPRUM_NAME=$(node -p "require('./package.json').name.replace('@','').replace('/','.').replace(/^plugin-/,'')" 2>/dev/null || echo "")
        _ROLE=$(node -p "require('./package.json').backstage?.role || 'frontend-plugin'" 2>/dev/null)
        _PLUGIN_ID=$(node -p "require('./package.json').backstage?.pluginId || '${{ values.pluginName }}'" 2>/dev/null)

        echo ""
        echo "════════════════════════════════════════════════════════════"
        echo "[plugin] Plugin files deployed!"
        echo ""
        echo "[plugin] Add this entry to your dynamic-plugins config"
        echo "[plugin] (e.g. /projects/rhdh-local/configs/dynamic-plugins/dynamic-plugins.yaml)"
        echo "[plugin] under the 'plugins:' list:"
        echo ""
        if [ "$_ROLE" = "frontend-plugin" ]; then
          printf '%s\n' \
            "  - package: ./dynamic-plugins-root/${_PKG_NAME}" \
            "    disabled: false" \
            "    pluginConfig:" \
            "      dynamicPlugins:" \
            "        frontend:" \
            "          ${_SCALPRUM_NAME}:" \
            "            dynamicRoutes:" \
            "              - path: /${_PLUGIN_ID}" \
            "                importName: SampleTestPage" \
            "                menuItem:" \
            "                  text: ${_PLUGIN_ID}" \
            "                  icon: extension"
        else
          printf '%s\n' \
            "  - package: ./dynamic-plugins-root/${_PKG_NAME}" \
            "    disabled: false"
        fi
        echo ""
        echo "════════════════════════════════════════════════════════════"
        echo "[plugin] After adding the config, run 'Restart RHDH' to load the plugin."
        echo "[plugin] Then visit: <your-rhdh-url>/${_PLUGIN_ID}"
      workingDir: /projects
      group:
        kind: build
        isDefault: false
  - id: restart-rhdh
    exec:
      label: "3. Restart RHDH"
      component: rhdh
      commandLine: |
        echo "[rhdh] Stopping RHDH..."
        # The rhdh container is minimal (no ps/pkill/ss). kill -9 -1 terminates
        # all user processes; the container stays alive via PID 1 (tail -f).
        kill -9 -1 2>/dev/null || true
        sleep 4
        echo "[rhdh] Starting RHDH..."

        # Auto-detect CLUSTER_APPS_DOMAIN if not set
        if [ -z "${CLUSTER_APPS_DOMAIN:-}" ]; then
          _endpoint_url=$(env | grep -i 'DEVWORKSPACE_ROUTING' | grep -i 'rhdh' | head -1 | sed 's/.*=https\?:\/\///' | sed 's|/.*||')
          if [ -n "$_endpoint_url" ]; then
            export CLUSTER_APPS_DOMAIN=$(echo "$_endpoint_url" | sed 's/^[^.]*\.//')
            echo "[rhdh] Auto-detected CLUSTER_APPS_DOMAIN=$CLUSTER_APPS_DOMAIN"
          fi
        fi

        chmod +x /projects/rhdh-local/scripts/start-rhdh.sh 2>/dev/null
        bash /projects/rhdh-local/scripts/start-rhdh.sh
      workingDir: /projects
      group:
        kind: run
        isDefault: false
  - id: test
    exec:
      label: "4. Run tests"
      component: tools
      commandLine: cd "${PROJECT_SOURCE:-/projects/${{ values.pluginName }}}" && yarn test
      workingDir: /projects
      group:
        kind: test
        isDefault: true
  - id: push-and-pr
    exec:
      label: "5. Push branch & create PR"
      component: tools
      commandLine: |
        set -e
        cd "${PROJECT_SOURCE:-/projects/${{ values.pluginName }}}"
        BRANCH="feat/${PLUGIN_NAME}-$(date +%Y%m%d%H%M)"
        git checkout -b "$BRANCH" 2>/dev/null || git checkout "$BRANCH"
        git add -A
        git commit -m "feat(${PLUGIN_NAME}): initial plugin implementation"
        git push -u origin "$BRANCH"
        gh pr create --fill
      workingDir: /projects
      group:
        kind: build
        isDefault: false
  # ── Optional: standalone UI iteration (no backend/plugins) ──────────────
  - id: start-plugin-dev
    exec:
      label: "(Optional) Start standalone dev server"
      component: tools
      commandLine: cd "${PROJECT_SOURCE:-/projects/${{ values.pluginName }}}" && yarn start
      workingDir: /projects
      group:
        kind: run
        isDefault: false
  # ── Infrastructure (runs automatically) ─────────────────────────────────
  - id: init-rhdh
    exec:
      label: Initialize RHDH (background)
      component: rhdh
      commandLine: |
        # Auto-detect CLUSTER_APPS_DOMAIN if not set
        if [ -z "${CLUSTER_APPS_DOMAIN:-}" ]; then
          _endpoint_url=$(env | grep -i 'DEVWORKSPACE_ROUTING' | grep -i 'rhdh' | head -1 | sed 's/.*=https\?:\/\///' | sed 's|/.*||')
          if [ -n "$_endpoint_url" ]; then
            export CLUSTER_APPS_DOMAIN=$(echo "$_endpoint_url" | sed 's/^[^.]*\.//')
          fi
        fi
        nohup bash -c '
          chmod +x /projects/rhdh-local/scripts/start-rhdh.sh 2>/dev/null
          bash /projects/rhdh-local/scripts/start-rhdh.sh
        ' > /tmp/rhdh-startup.log 2>&1 &
        echo "[rhdh] RHDH starting in background. Monitor with: tail -f /tmp/rhdh-startup.log"
      workingDir: /projects
      group:
        kind: run
        isDefault: false
  - id: start-rhdh
    exec:
      label: Start RHDH (foreground)
      component: rhdh
      commandLine: |
        # Auto-detect CLUSTER_APPS_DOMAIN if not set
        if [ -z "${CLUSTER_APPS_DOMAIN:-}" ]; then
          _endpoint_url=$(env | grep -i 'DEVWORKSPACE_ROUTING' | grep -i 'rhdh' | head -1 | sed 's/.*=https\?:\/\///' | sed 's|/.*||')
          if [ -n "$_endpoint_url" ]; then
            export CLUSTER_APPS_DOMAIN=$(echo "$_endpoint_url" | sed 's/^[^.]*\.//')
            echo "[rhdh] Auto-detected CLUSTER_APPS_DOMAIN=$CLUSTER_APPS_DOMAIN"
          fi
        fi
        chmod +x /projects/rhdh-local/scripts/start-rhdh.sh 2>/dev/null
        bash /projects/rhdh-local/scripts/start-rhdh.sh
      workingDir: /projects
      group:
        kind: run
        isDefault: true
events:
  postStart:
    - init-rhdh
