apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: plugin-creator
  title: Plugin Creator
  description: Scaffold a new Backstage plugin with a pre-configured Dev Spaces workspace. Creates a GitHub repo and opens it in OpenShift Dev Spaces with all dependencies ready.
  tags:
    - plugin
    - devspaces
    - recommended
  annotations:
    rhdh.redhat.com/time-saved: '6 hours'
spec:
  owner: group:default/platform-engineering
  type: service

  parameters:
    - title: Plugin Details
      required:
        - pluginName
        - pluginType
        - owner
      properties:
        pluginName:
          title: Plugin Name
          type: string
          description: Name of the new plugin (lowercase, hyphens only)
          ui:autofocus: true
          pattern: '^[a-z][a-z0-9-]*$'
        pluginType:
          title: Plugin Type
          type: string
          description: The type of Backstage plugin to create
          enum:
            - frontend
            - backend
            - common
          enumNames:
            - Frontend plugin
            - Backend plugin
            - Common library
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group]
    - title: Dev Spaces Environment
      required:
        - rhdhLocalRepoUrl
      properties:
        rhdhLocalRepoUrl:
          title: Enterprise rhdh-local Repository
          type: string
          description: >-
            URL of your enterprise rhdh-local fork
            (e.g. https://github.com/my-org/rhdh-local).
            This repo will be cloned into the Dev Spaces workspace
            so its scripts and configs are available for testing.
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Fetch Plugin Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          pluginName: ${{ parameters.pluginName }}
          pluginType: ${{ parameters.pluginType }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          rhdhLocalRepoUrl: ${{ parameters.rhdhLocalRepoUrl }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: Backstage ${{ parameters.pluginType }} plugin - ${{ parameters.pluginName }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
        optional: true

  output:
    links:
      - title: Open in Dev Spaces
        icon: web
        url: https://workspaces.openshift.com/#${{ steps.publish.output.remoteUrl }}
      - title: View Repository
        icon: github
        url: ${{ steps.publish.output.remoteUrl }}
    text:
      - title: Plugin Summary
        content: |
          **Plugin:** `${{ parameters.pluginName }}`
          **Type:** ${{ parameters.pluginType }}
          **Owner:** ${{ parameters.owner }}
          **Repository:** [${{ steps.publish.output.remoteUrl }}](${{ steps.publish.output.remoteUrl }})

          Your Dev Spaces workspace is ready with Node.js, TypeScript, and Yarn pre-installed.
          Click **Open in Dev Spaces** above to start coding immediately.
