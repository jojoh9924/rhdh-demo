apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: plugin-creator
  title: Plugin Creator
  description: >-
    Scaffold a new RHDH dynamic plugin with a pre-configured Dev Spaces workspace.
    Creates a GitHub repo with a devfile that boots a real RHDH instance for
    integration testing.
  tags:
    - plugin
    - devspaces
    - recommended
  annotations:
    rhdh.redhat.com/time-saved: '6 hours'
spec:
  owner: group:default/platform-engineering
  type: service

  # ┌─────────────────────────────────────────────────────────────────────────┐
  # │ PLATFORM CONFIGURATION                                                  │
  # │                                                                         │
  # │ These values are set by the platform engineer when deploying this       │
  # │ template to an RHDH instance. Developers never see or change them.      │
  # │                                                                         │
  # │ To customize: fork this template and update the values below, or        │
  # │ override via app-config.yaml at the RHDH instance level.                │
  # └─────────────────────────────────────────────────────────────────────────┘
  # Platform-level defaults (not exposed to the developer form):
  #   rhdhLocalRepoUrl: URL of the enterprise rhdh-local repo
  #   devSpacesUrl: Base URL of the OpenShift Dev Spaces instance

  parameters:
    - title: Plugin Details
      required:
        - pluginName
        - pluginType
        - owner
      properties:
        pluginName:
          title: Plugin Name
          type: string
          description: Name of the new plugin (lowercase, hyphens only)
          ui:autofocus: true
          pattern: '^[a-z][a-z0-9-]*$'
        pluginType:
          title: Plugin Type
          type: string
          description: The type of Backstage plugin to create
          enum:
            - frontend
            - backend
            - common
          enumNames:
            - Frontend plugin
            - Backend plugin
            - Common library
        owner:
          title: Owner
          type: string
          description: Owner of the component
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: [Group]
    - title: Choose a location
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch
      name: Fetch Plugin Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          pluginName: ${{ parameters.pluginName }}
          pluginType: ${{ parameters.pluginType }}
          owner: ${{ parameters.owner }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          # ── Platform-configured values ──
          # Change these when deploying this template to your enterprise RHDH.
          rhdhLocalRepoUrl: https://github.com/redhat-developer/rhdh-local.git
          devSpacesUrl: https://workspaces.openshift.com

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: RHDH ${{ parameters.pluginType }} plugin - ${{ parameters.pluginName }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register in Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
        optional: true

  output:
    links:
      - title: Open in Dev Spaces
        icon: web
        url: https://workspaces.openshift.com/#${{ steps.publish.output.remoteUrl }}
      - title: View Repository
        icon: github
        url: ${{ steps.publish.output.remoteUrl }}
    text:
      - title: Plugin Summary
        content: |
          **Plugin:** `${{ parameters.pluginName }}`
          **Type:** ${{ parameters.pluginType }}
          **Owner:** ${{ parameters.owner }}
          **Repository:** [${{ steps.publish.output.remoteUrl }}](${{ steps.publish.output.remoteUrl }})

          Click **Open in Dev Spaces** to start coding. The workspace boots a real
          RHDH 1.10 instance — your plugin will be tested alongside all bundled plugins
          with a full backend.
