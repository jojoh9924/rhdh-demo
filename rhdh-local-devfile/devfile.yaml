schemaVersion: 2.3.0
metadata:
  name: rhdh-plugin-dev
  version: 1.1.0
  displayName: RHDH Plugin Development
  description: >-
    Dev Spaces workspace for developing and testing dynamic plugins against a
    local RHDH instance. Enterprise example configuration.
attributes:
  controller.devfile.io/storage-type: per-workspace

components:
  # ── Developer Tools Container ────────────────────────────────────────────
  # NOTE: Use the 'tools' container terminal for debugging (has ps, ss, etc).
  # The 'rhdh' container is minimal and lacks most diagnostic utilities.
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi9-latest
      mountSources: true
      memoryLimit: 6Gi
      memoryRequest: 512Mi
      cpuLimit: "2"
      cpuRequest: 500m
      env:
        # IMPORTANT: Set this to your cluster's apps domain.
        # Find it with: oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
        - name: CLUSTER_APPS_DOMAIN
          value: "apps.rm3.7wse.p1.openshiftapps.com"
        - name: PLUGIN_NAME
          value: ""
        - name: DYNAMIC_PLUGINS_ROOT
          value: /dynamic-plugins-root
        - name: NODE_OPTIONS
          value: "--max-old-space-size=3072"
        - name: PROXY_HOST
          value: ""
        - name: PROXY_PORT
          value: ""
      endpoints:
        - name: plugin-dev
          exposure: public
          targetPort: 3000
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
      volumeMounts:
        - name: dynamic-plugins-root
          path: /dynamic-plugins-root
        - name: yarn-cache
          path: /home/user/.cache/yarn

  # ── RHDH Container ──────────────────────────────────────────────────────
  - name: rhdh
    container:
      image: quay.io/rhdh-community/rhdh:1.10
      command: ["tail"]
      args: ["-f", "/dev/null"]
      mountSources: true
      memoryLimit: 6Gi
      memoryRequest: 1Gi
      cpuLimit: "2"
      cpuRequest: 500m
      env:
        - name: DEVSPACE_SCRIPTS_DIR
          value: /projects/rhdh-local
        - name: BASE_URL
          value: auto
        - name: RHDH_PUBLIC_ENDPOINT_NAME
          value: rhdh
        # IMPORTANT: Must match the cluster where Dev Spaces is running.
        # Find it with: oc get ingresses.config/cluster -o jsonpath='{.spec.domain}'
        - name: CLUSTER_APPS_DOMAIN
          value: "apps.rm3.7wse.p1.openshiftapps.com"
        - name: NODE_ENV
          value: development
        - name: NODE_OPTIONS
          value: "--inspect=0.0.0.0:9229 --no-node-snapshot"
        - name: CATALOG_INDEX_IMAGE
          value: quay.io/rhdh/plugin-catalog-index:1.10
        - name: WAIT_FOR_PLUGINS_TIMEOUT
          value: "180"
        - name: CATALOG_ENTITIES_EXTRACT_DIR
          value: /opt/app-root/src/extensions
        - name: ENABLE_AUTH_PROVIDER_MODULE_OVERRIDE
          value: "true"
        - name: ENABLE_CORE_ROOTHTTPROUTER_OVERRIDE
          value: "true"
      endpoints:
        - name: rhdh
          exposure: public
          targetPort: 7007
          protocol: https
          attributes:
            discoverable: true
            urlRewriteSupported: false
        - name: node-debug
          exposure: internal
          targetPort: 9229
          protocol: tcp
      volumeMounts:
        - name: dynamic-plugins-root
          path: /opt/app-root/src/dynamic-plugins-root
        - name: dynamic-plugins-root
          path: /dynamic-plugins-root
        - name: extensions-catalog
          path: /opt/app-root/src/extensions
        - name: rhdh-generated
          path: /opt/app-root/src/generated

  # ── Volumes ─────────────────────────────────────────────────────────────
  - name: dynamic-plugins-root
    volume:
      size: 2Gi
  - name: extensions-catalog
    volume:
      size: 1Gi
  - name: rhdh-generated
    volume:
      size: 512Mi
  - name: yarn-cache
    volume:
      size: 2Gi
  - name: projects
    volume:
      size: 20Gi

commands:
  # ── RHDH ────────────────────────────────────────────────────────────────
  - id: start-rhdh
    exec:
      label: "Start RHDH"
      component: rhdh
      commandLine: |
        if [ ! -d "/projects/rhdh-local" ]; then
          echo "[rhdh] Cloning rhdh-local..."
          if command -v git >/dev/null 2>&1; then
            git clone https://github.com/redhat-developer/rhdh-local.git /projects/rhdh-local
          else
            echo "[rhdh] git not found, installing..."
            microdnf install -y git 2>/dev/null || dnf install -y git 2>/dev/null || yum install -y git
            git clone https://github.com/redhat-developer/rhdh-local.git /projects/rhdh-local
          fi
        fi

        # Construct BASE_URL from Dev Spaces env vars + CLUSTER_APPS_DOMAIN
        if [ -z "${BASE_URL:-}" ] || [ "${BASE_URL}" = "auto" ]; then
          if [ -n "${CLUSTER_APPS_DOMAIN:-}" ] && [ -n "${DEVWORKSPACE_NAMESPACE:-}" ] && [ -n "${DEVWORKSPACE_NAME:-}" ]; then
            _user="${DEVWORKSPACE_NAMESPACE%-dev}"
            _endpoint="${RHDH_PUBLIC_ENDPOINT_NAME:-rhdh}"
            export BASE_URL="https://${_user}-${DEVWORKSPACE_NAME}-${_endpoint}.${CLUSTER_APPS_DOMAIN}"
            echo "[rhdh] BASE_URL=$BASE_URL"
          fi
        fi

        chmod +x "/projects/rhdh-local/scripts/start-rhdh.sh" 2>/dev/null
        /projects/rhdh-local/scripts/start-rhdh.sh
      workingDir: /projects
      group:
        kind: run
        isDefault: true
  - id: restart-rhdh
    exec:
      label: "Restart RHDH"
      component: rhdh
      commandLine: |
        echo "[rhdh] Stopping RHDH..."
        # Force-kill all node processes (the rhdh container is minimal —
        # pkill/ps/ss are unavailable, so use kill -9 -1 to kill all user procs).
        kill -9 -1 2>/dev/null || true
        sleep 4
        echo "[rhdh] Starting RHDH..."
        if [ ! -d "/projects/rhdh-local" ]; then
          echo "[rhdh] Cloning rhdh-local..."
          if command -v git >/dev/null 2>&1; then
            git clone https://github.com/redhat-developer/rhdh-local.git /projects/rhdh-local
          else
            microdnf install -y git 2>/dev/null || dnf install -y git 2>/dev/null || yum install -y git
            git clone https://github.com/redhat-developer/rhdh-local.git /projects/rhdh-local
          fi
        fi

        # Construct BASE_URL from Dev Spaces env vars + CLUSTER_APPS_DOMAIN
        if [ -z "${BASE_URL:-}" ] || [ "${BASE_URL}" = "auto" ]; then
          if [ -n "${CLUSTER_APPS_DOMAIN:-}" ] && [ -n "${DEVWORKSPACE_NAMESPACE:-}" ] && [ -n "${DEVWORKSPACE_NAME:-}" ]; then
            _user="${DEVWORKSPACE_NAMESPACE%-dev}"
            _endpoint="${RHDH_PUBLIC_ENDPOINT_NAME:-rhdh}"
            export BASE_URL="https://${_user}-${DEVWORKSPACE_NAME}-${_endpoint}.${CLUSTER_APPS_DOMAIN}"
            echo "[rhdh] BASE_URL=$BASE_URL"
          fi
        fi

        chmod +x "/projects/rhdh-local/scripts/start-rhdh.sh" 2>/dev/null
        /projects/rhdh-local/scripts/start-rhdh.sh
      workingDir: /projects
      group:
        kind: run
        isDefault: false

  # ── Plugin Development ───────────────────────────────────────────────────
  - id: create-sample-plugin
    exec:
      label: "Create sample test plugin"
      component: tools
      commandLine: |
        if [ ! -d "/projects/rhdh-local-devfile" ]; then
          echo "[plugin] rhdh-local-devfile not found, downloading script..."
          curl -sSfL https://raw.githubusercontent.com/redhat-developer/rhdh-local/main/devfile/scripts/create-sample-plugin.sh | bash
        else
          chmod +x /projects/rhdh-local-devfile/scripts/create-sample-plugin.sh
          /projects/rhdh-local-devfile/scripts/create-sample-plugin.sh
        fi
      workingDir: /projects
      group:
        kind: build
        isDefault: false
  - id: deploy-plugin
    exec:
      label: "Deploy plugin to RHDH"
      component: tools
      commandLine: |
        set -e
        _PLUGIN="${PLUGIN_NAME:-}"
        if [ -z "$_PLUGIN" ] && [ -t 0 ]; then
          read -r -p "[plugin] Enter plugin directory name: " _PLUGIN
        fi
        [ -z "$_PLUGIN" ] && { echo "[plugin] ERROR: Set PLUGIN_NAME or provide input"; exit 1; }

        _PLUGIN_DIR="/projects/$_PLUGIN"
        [ -d "$_PLUGIN_DIR" ] || { echo "[plugin] ERROR: Directory $_PLUGIN_DIR not found"; exit 1; }

        cd "$_PLUGIN_DIR"
        [ -f package.json ] || { echo "[plugin] ERROR: No package.json in $_PLUGIN_DIR — is this a plugin?"; exit 1; }

        # Anchor yarn to this directory so it doesn't traverse up to a parent project root
        [ -f yarn.lock ] || touch yarn.lock

        echo "[plugin] Installing dependencies..."
        yarn install

        echo "[plugin] Exporting dynamic plugin..."
        rm -rf dist-dynamic
        npx --yes @red-hat-developer-hub/cli@latest plugin export

        # ── Copy the exported plugin to dynamic-plugins-root ──
        _PKG_NAME=$(node -p "require('./package.json').name" 2>/dev/null | sed 's/@//;s/\//-/g;s/plugin-//')
        _EXPORT_DIR="$_PLUGIN_DIR/dist-dynamic"
        _DEST="/dynamic-plugins-root/${_PKG_NAME:-$_PLUGIN}"

        if [ ! -d "$_EXPORT_DIR" ]; then
          echo "[plugin] ERROR: Export did not produce dist-dynamic/. Check build output above."
          exit 1
        fi

        echo "[plugin] Copying to $_DEST..."
        rm -rf "$_DEST"
        cp -r "$_EXPORT_DIR" "$_DEST"
        echo "[plugin] Plugin deployed to: $_DEST"

        # ── Print config snippet for the user to add ──
        _SCALPRUM_NAME=$(node -p "require('./package.json').name.replace('@','').replace('/','.').replace(/^plugin-/,'')" 2>/dev/null || echo "")
        _ROLE=$(node -p "require('./package.json').backstage?.role || 'frontend-plugin'" 2>/dev/null)
        _PLUGIN_ID=$(node -p "require('./package.json').backstage?.pluginId || '$_PLUGIN'" 2>/dev/null)
        _REL_PATH="./dynamic-plugins-root/${_PKG_NAME:-$_PLUGIN}"

        echo ""
        echo "════════════════════════════════════════════════════════════"
        echo "[plugin] Plugin files deployed!"
        echo ""
        echo "[plugin] Add this entry to your dynamic-plugins config"
        echo "[plugin] (e.g. /projects/rhdh-local/configs/dynamic-plugins/dynamic-plugins.yaml)"
        echo "[plugin] under the 'plugins:' list:"
        echo ""
        if [ "$_ROLE" = "frontend-plugin" ]; then
          printf '%s\n' \
            "  - package: ${_REL_PATH}" \
            "    disabled: false" \
            "    pluginConfig:" \
            "      dynamicPlugins:" \
            "        frontend:" \
            "          ${_SCALPRUM_NAME}:" \
            "            dynamicRoutes:" \
            "              - path: /${_PLUGIN_ID}" \
            "                importName: SampleTestPage" \
            "                menuItem:" \
            "                  text: ${_PLUGIN_ID}" \
            "                  icon: extension"
        else
          printf '%s\n' \
            "  - package: ${_REL_PATH}" \
            "    disabled: false"
        fi
        echo ""
        echo "════════════════════════════════════════════════════════════"
        echo "[plugin] After adding the config, run 'Restart RHDH' to load the plugin."
        echo "[plugin] Then visit: <your-rhdh-url>/${_PLUGIN_ID}"
      workingDir: /projects
      group:
        kind: build
        isDefault: false

events:
  postStart:
    - start-rhdh
